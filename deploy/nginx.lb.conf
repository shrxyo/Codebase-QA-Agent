# Load balancer in front of the API replicas (docker compose `lb` service).
#
# Round-robin, no sticky sessions: every replica is stateless (repo registry
# in Postgres, vectors in the Chroma server, indexing in Celery workers), and
# a chat is one self-contained request because the client sends the history.

# Docker's embedded DNS. `resolve` below re-reads the `api` name's A records
# every few seconds, so `docker compose up --scale api=N` and restarted
# replicas (new IPs) are picked up without reloading nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
    zone api 64k;
    # Passive health check: a replica that refuses a connection is skipped
    # for 10 s, and the request is retried on another one.
    server api:8000 resolve max_fails=1 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    client_max_body_size 1m;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # /chat is Server-Sent Events: pass each token through immediately.
        proxy_buffering off;
        proxy_read_timeout 300s;

        # Retry on another replica only if this one was unreachable. nginx
        # never re-sends a POST that already reached a replica, so a chat is
        # never answered twice.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;

        # Which replica served the request (for the scale demo).
        add_header X-Upstream $upstream_addr always;
    }
}
