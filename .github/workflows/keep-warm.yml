name: keep-warm

# Render's free tier spins a web service down after 15 min without traffic,
# and a cold start (pull image + load the embedding model) takes ~1 min.
# Pinging /health every 10 min keeps the demo instance awake.
# Note: GitHub can delay scheduled runs by several minutes under load, and
# disables schedules after 60 days without repo activity.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          # Override with a repository variable if the service URL changes.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://codebase-qa-agent.onrender.com' }}
        run: |
          # Short timeout per attempt; retries cover the case where the ping
          # itself lands on a cold start.
          curl --fail --silent --show-error --max-time 20 \
               --retry 3 --retry-delay 10 --retry-all-errors \
               "$BACKEND_URL/health"
