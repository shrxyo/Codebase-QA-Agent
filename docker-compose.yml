services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides any value in .env so the index lands in the named volume
      CHROMA_PERSIST_DIR: /data/chroma
    volumes:
      - ./backend:/app
      - chroma_data:/data/chroma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle and called from the browser on the host,
        # so it's the host-published backend port, not http://backend:8000.
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  chroma_data:
